<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DYNAMIS - Cadastro</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="auth-body">

  <div class="auth-bg-shape"></div>

  <a href="index.html" class="auth-home-icon"><i class="fa-solid fa-house"></i></a>

  <a href="index.html">
    <img src="img/logo.png" alt="DYNAMIS" class="auth-logo">
  </a>

  <div class="auth-illustration">
    <!-- ALTERE O CAMINHO ABAIXO CASO O NOME DO ARQUIVO SEJA DIFERENTE -->
    <img src="img/auth-ilustracao.png" alt="Ilustração DYNAMIS">
  </div>

  <div class="auth-wrapper">
    <div class="auth-card">
      <h1>Cadastro</h1>

      <form id="cadastro-form">
        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
          <label for="senha">Senha</label>
          <input type="password" id="senha" name="senha" required>
        </div>

        <button type="submit" class="btn-auth">Cadastrar</button>
      </form>

      <p class="auth-link">Já tem uma conta? <a href="login.html">Acesse aqui</a></p>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
